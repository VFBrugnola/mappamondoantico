<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vicino Oriente Antico</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data/civilizations.js"></script>
<script src="data/periods.js"></script>
<script src="data/events.js"></script>
<script src="data/cities.js"></script>
<script src="data/rulers.js"></script>
<script src="data/routes.js"></script>
<script src="data/battles.js"></script>
<script src="data/archaeology.js"></script>
<script src="data/regional_periods.js"></script>
<script src="data/basemap.js"></script>
<script src="data/borders.js"></script>
<script src="timeline.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Georgia",serif; background:#1a1208; color:#e8d9b0;
       height:100vh; display:flex; flex-direction:column; overflow:hidden; }

/* HEADER */
header { background:linear-gradient(to bottom,#0e0a05,#1a1208);
         border-bottom:1px solid #5c3d0a; padding:7px 14px;
         display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
header h1 { font-size:0.95rem; letter-spacing:0.1em; text-transform:uppercase;
            color:#d4a843; font-weight:normal; }
header p { font-size:0.62rem; color:#8a7050; font-style:italic; }

/* MAIN AREA: mappa + pannello sovrani */
#main-area { flex:1; display:flex; min-height:0; }
#map { flex:1; min-width:0; }
.leaflet-container { background:#cfdde3; }
/* CONFINI (Cliopatria) */
.border-label { transform:translate(-50%,-50%); white-space:nowrap; font-family:"Georgia",serif;
  font-size:11px; font-style:italic; letter-spacing:0.04em; color:#3a2a12; pointer-events:none;
  text-shadow:0 0 3px #f5efe2, 0 0 3px #f5efe2, 0 0 6px #f5efe2; }
.border-popup-title { font-size:0.9rem; color:#d4a843; margin-bottom:2px; }
.border-popup-years { font-size:0.65rem; color:#8a7050; font-style:italic; margin-bottom:5px; }
.border-popup-src { font-size:0.6rem; color:#5a4020; margin-top:5px; padding-top:4px; border-top:1px solid #2a1a00; line-height:1.4; }
.border-popup-src a { color:#5a80a0; }
.borders-badge { background:rgba(14,10,5,0.85); border:1px solid #5c3d0a; border-radius:3px; padding:3px 8px;
  font-family:"Georgia",serif; font-size:0.62rem; color:#c8b890; }
.borders-badge b { color:#d4a843; font-weight:normal; }
#toggle-borders { flex-shrink:0; background:none; border:1px solid #3a2a0a; color:#8a7050;
  font-family:"Georgia",serif; font-size:0.6rem; padding:3px 9px; cursor:pointer; border-radius:2px; white-space:nowrap; }
#toggle-borders.active { border-color:#d4a843; color:#d4a843; background:rgba(212,168,67,0.12); }

/* RULERS PANEL */
#rulers-panel {
  width:230px; flex-shrink:0;
  background:#070503; border-left:1px solid #3a2a0a;
  display:flex; flex-direction:column; overflow:hidden;
}
#rulers-panel-header {
  padding:7px 10px 5px;
  border-bottom:1px solid #2a1a00;
  flex-shrink:0;
}
#rulers-panel-header h3 {
  font-size:0.65rem; letter-spacing:0.08em; text-transform:uppercase;
  color:#d4a843; font-weight:normal;
}
#rulers-year-display {
  font-size:0.6rem; color:#6a5535; font-style:italic; margin-top:1px;
}
#rulers-list {
  flex:1; overflow-y:auto; padding:5px 0;
}
#rulers-list::-webkit-scrollbar { width:4px; }
#rulers-list::-webkit-scrollbar-thumb { background:#3a2a0a; border-radius:2px; }

.ruler-state-group { margin-bottom:1px; }
.ruler-state-name {
  font-size:0.58rem; letter-spacing:0.1em; text-transform:uppercase;
  color:#5a4020; padding:4px 10px 2px;
  border-top:1px solid #1a1200;
}
.ruler-entry {
  padding:3px 10px 3px 14px;
  display:flex; align-items:flex-start; gap:5px;
}
.ruler-dot {
  width:5px; height:5px; border-radius:50%; flex-shrink:0; margin-top:4px;
}
.ruler-info { flex:1; min-width:0; }
.ruler-name {
  font-size:0.68rem; color:#c8b890; line-height:1.2;
}
.ruler-dates {
  font-size:0.58rem; color:#4a3010; font-style:italic;
}
.ruler-note {
  font-size:0.58rem; color:#6a5535; line-height:1.3; margin-top:1px;
}
#rulers-empty {
  font-size:0.65rem; color:#4a3820; font-style:italic;
  padding:12px 10px; text-align:center; line-height:1.5;
}

/* PERIOD BAR */
#period-bar { flex-shrink:0; background:#0a0805; border-top:1px solid #2a1a00;
  padding:5px 10px; display:flex; gap:5px; overflow-x:auto; align-items:center; }
#period-bar::-webkit-scrollbar { height:3px; }
#period-bar::-webkit-scrollbar-thumb { background:#5c3d0a; border-radius:2px; }
.period-btn { flex-shrink:0; background:none; border:1px solid #3a2a0a; color:#8a7050;
  font-family:"Georgia",serif; font-size:0.6rem; padding:3px 8px; cursor:pointer;
  border-radius:2px; white-space:nowrap; transition:all 0.15s; }
.period-btn:hover, .period-btn.active { border-color:#d4a843; color:#d4a843;
  background:rgba(212,168,67,0.12); }
#btn-all-periods { flex-shrink:0; background:none; border:1px solid #5c3d0a; color:#d4a843;
  font-family:"Georgia",serif; font-size:0.6rem; padding:3px 9px; cursor:pointer;
  border-radius:2px; white-space:nowrap; }
#btn-all-periods.active { background:rgba(212,168,67,0.18); }

/* TIMELINE */
#timeline-bar { flex-shrink:0; background:#0e0a05; border-top:1px solid #3a2a0a;
  padding:7px 14px 8px; display:flex; align-items:center; gap:10px; }
#year-label { font-family:"Georgia",serif; font-size:0.85rem; color:#d4a843;
  min-width:95px; text-align:center; letter-spacing:0.05em; }
#year-slider { flex:1; -webkit-appearance:none; height:4px;
  background:linear-gradient(to right,#5c3d0a,#d4a843,#5c3d0a);
  border-radius:2px; outline:none; cursor:pointer; }
#year-slider::-webkit-slider-thumb { -webkit-appearance:none; width:15px; height:15px;
  border-radius:50%; background:#d4a843; border:2px solid #0e0a05; cursor:pointer; }
#year-slider::-moz-range-thumb { width:15px; height:15px; border-radius:50%;
  background:#d4a843; border:2px solid #0e0a05; cursor:pointer; }

/* EVENT PANEL */
#event-panel { flex-shrink:0; background:#070503; border-top:1px solid #2a1a00;
  padding:6px 14px 7px; min-height:44px; display:none; gap:8px; align-items:flex-start; }
#event-panel.visible { display:flex; }
#event-dot { width:8px; height:8px; border-radius:50%; background:#d4a843;
  flex-shrink:0; margin-top:4px; box-shadow:0 0 6px rgba(212,168,67,0.5); }
#event-body { flex:1; min-width:0; }
#event-title { font-size:0.72rem; color:#d4a843; margin-bottom:1px; }
#event-year-label { font-size:0.6rem; color:#4a3010; font-style:italic; }
#event-desc { font-size:0.65rem; color:#8a7050; line-height:1.4; margin-top:2px; }
#event-tipo { font-size:0.58rem; color:#3a2a0a; text-transform:uppercase;
  letter-spacing:0.06em; margin-top:2px; }

/* LEGEND */
.legend { background:rgba(14,10,5,0.93); border:1px solid #5c3d0a; border-radius:4px;
  padding:9px 11px; font-family:"Georgia",serif; font-size:0.66rem;
  color:#c8b890; min-width:155px; max-height:calc(100vh - 200px);
  overflow-y:auto; backdrop-filter:blur(4px); }
.legend h4 { font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase;
  color:#d4a843; margin-bottom:7px; border-bottom:1px solid #3a2a0a;
  padding-bottom:4px; font-weight:normal; }
.legend-item { display:flex; align-items:center; gap:6px; margin-bottom:4px;
  cursor:pointer; transition:opacity 0.2s; user-select:none; }
.legend-item:hover { opacity:0.75; }
.legend-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0;
  border:1.5px solid rgba(255,255,255,0.2); }
.legend-item.dim { opacity:0.3; }

/* POPUP */
.leaflet-popup-content-wrapper { background:#0e0a05; border:1px solid #5c3d0a;
  border-radius:4px; color:#e8d9b0; font-family:"Georgia",serif;
  box-shadow:0 4px 20px rgba(0,0,0,0.7); max-width:270px; }
.leaflet-popup-tip { background:#5c3d0a; }
.leaflet-popup-content { margin:10px 13px; }
.popup-title { font-size:0.92rem; color:#d4a843; margin-bottom:1px; }
.popup-modern { font-size:0.63rem; color:#6a5535; font-style:italic; margin-bottom:2px; }
.popup-badges { display:flex; gap:5px; margin-bottom:5px; flex-wrap:wrap; }
.popup-badge { font-size:0.58rem; padding:1px 5px; border-radius:2px;
  border:1px solid; letter-spacing:0.04em; }
.popup-img { width:100%; height:95px; object-fit:cover; border-radius:2px;
  margin-bottom:5px; border:1px solid #3a2a0a; display:block; }
.popup-desc { font-size:0.7rem; color:#c8b890; line-height:1.5; }
.popup-era { font-size:0.62rem; color:#6a5535; margin-top:3px; }
.popup-museum { font-size:0.62rem; color:#8a7050; margin-top:5px;
  padding-top:4px; border-top:1px solid #2a1a00; line-height:1.4; }
.popup-museum::before { content:"Museo: "; color:#5a4020; }
.popup-events { margin-top:6px; padding-top:5px; border-top:1px solid #2a1a00; }
.popup-events-title { font-size:0.6rem; color:#5a4020; text-transform:uppercase;
  letter-spacing:0.06em; margin-bottom:4px; }
.popup-event-item { font-size:0.65rem; color:#8a7050; margin-bottom:3px;
  padding-left:8px; border-left:2px solid #3a2a0a; line-height:1.3; }
.popup-event-item span { color:#a08040; font-size:0.6rem; }
.popup-wiki { margin-top:5px; }
.popup-wiki a { font-size:0.62rem; color:#5a80a0; }
/* ROTTE */
.route-popup-title { font-size:0.85rem; color:#d4a843; margin-bottom:3px; }
.route-popup-tipo  { font-size:0.6rem; color:#6a5535; text-transform:uppercase;
  letter-spacing:0.08em; margin-bottom:6px; }
.route-popup-merci { margin-bottom:5px; }
.route-popup-merce { display:flex; gap:6px; align-items:flex-start;
  margin-bottom:5px; padding-bottom:5px; border-bottom:1px solid #2a1a00; }
.route-popup-merce:last-child { border-bottom:none; margin-bottom:0; }
.route-popup-merce-icon { font-size:1rem; flex-shrink:0; line-height:1; }
.route-popup-merce-body { flex:1; }
.route-popup-merce-nome { font-size:0.72rem; color:#c8b890; font-weight:bold; }
.route-popup-merce-note { font-size:0.63rem; color:#8a7050; line-height:1.4; margin-top:1px; }
.route-popup-desc  { font-size:0.65rem; color:#8a7050; line-height:1.5;
  margin-top:5px; padding-top:5px; border-top:1px solid #2a1a00; }
.route-popup-fonte { font-size:0.6rem; color:#4a3010; font-style:italic; margin-top:4px; }
/* ARCHEOLOGIA */
.arch-popup-title  { font-size:0.9rem; color:#a0d0a0; margin-bottom:1px; }
.arch-popup-chi    { font-size:0.63rem; color:#6a8560; font-style:italic; margin-bottom:5px; }
.arch-popup-trova  { margin-bottom:5px; }
.arch-popup-trovato { border-bottom:1px solid #1a2a1a; padding-bottom:5px; margin-bottom:5px; }
.arch-popup-trovato:last-child { border-bottom:none; padding-bottom:0; margin-bottom:0; }
.arch-popup-trovato-nome { font-size:0.72rem; color:#c8b890; }
.arch-popup-trovato-museo { font-size:0.6rem; color:#4a6040; margin-top:1px; }
.arch-popup-trovato-nota { font-size:0.63rem; color:#8a9880; line-height:1.4; margin-top:2px; }
.arch-popup-desc   { font-size:0.65rem; color:#8a7050; line-height:1.5;
  margin-top:5px; padding-top:5px; border-top:1px solid #1a2a1a; }
/* Toggle archeologia */
#toggle-arch {
  background:none; border:1px solid #2a4030; color:#6a8560;
  font-family:"Georgia",serif; font-size:0.6rem; padding:3px 9px; cursor:pointer;
  border-radius:2px; white-space:nowrap; transition:all 0.15s; flex-shrink:0;
}
#toggle-arch.active { border-color:#a0d0a0; color:#a0d0a0; background:rgba(160,208,160,0.1); }
/* BATTAGLIE */
.battle-popup-title  { font-size:0.9rem; color:#e74c3c; margin-bottom:2px; }
.battle-popup-anno   { font-size:0.62rem; color:#6a5535; font-style:italic; margin-bottom:5px; }
.battle-popup-fazioni { margin-bottom:6px; }
.battle-popup-fazione { font-size:0.68rem; color:#c8b890; padding:2px 0;
  display:flex; gap:5px; align-items:baseline; }
.battle-popup-ruolo  { font-size:0.6rem; padding:1px 5px; border-radius:2px;
  border:1px solid; letter-spacing:0.04em; flex-shrink:0; }
.ruolo-vincitore  { color:#27ae60; border-color:#27ae6050; }
.ruolo-sconfitto  { color:#e74c3c; border-color:#e74c3c50; }
.ruolo-contendente{ color:#f39c12; border-color:#f39c1250; }
.battle-popup-esito   { font-size:0.68rem; color:#d4a843; margin-bottom:5px;
  padding:4px 7px; background:rgba(212,168,67,0.08); border-radius:2px;
  border-left:2px solid #d4a843; line-height:1.4; }
.battle-popup-desc    { font-size:0.68rem; color:#8a7050; line-height:1.5; margin-bottom:5px; }
.battle-popup-sig     { font-size:0.63rem; color:#6a7585; line-height:1.4;
  font-style:italic; border-top:1px solid #2a1a00; padding-top:4px; margin-top:4px; }
.battle-popup-fonte   { font-size:0.6rem; color:#4a3010; margin-top:4px; }
/* Toggle battaglie */
#toggle-battles {
  background:none; border:1px solid #3a2a0a; color:#8a7050;
  font-family:"Georgia",serif; font-size:0.6rem; padding:3px 9px; cursor:pointer;
  border-radius:2px; white-space:nowrap; transition:all 0.15s; flex-shrink:0;
}
#toggle-battles.active { border-color:#e74c3c; color:#e74c3c; background:rgba(231,76,60,0.1); }
/* Toggle rotte */
#toggle-routes {
  background:none; border:1px solid #3a2a0a; color:#8a7050;
  font-family:"Georgia",serif; font-size:0.6rem; padding:3px 9px; cursor:pointer;
  border-radius:2px; white-space:nowrap; transition:all 0.15s;
  margin-left:auto; flex-shrink:0;
}
#toggle-routes.active { border-color:#d4a843; color:#d4a843; background:rgba(212,168,67,0.12); }
/* Legenda rotte */
.legend-route-item { display:flex; align-items:center; gap:6px; margin-bottom:4px;
  font-size:0.63rem; }
.legend-route-line { width:22px; height:3px; flex-shrink:0; border-radius:1px; }
.leaflet-control-zoom a { background:#0e0a05 !important; color:#d4a843 !important;
  border-color:#5c3d0a !important; }

/* ── LINEA DEL TEMPO (timeline.js) ──────────────────────────────── */
#toggle-timeline { flex-shrink:0; background:none; border:1px solid #5c3d0a; color:#d4a843;
  font-family:"Georgia",serif; font-size:0.6rem; padding:3px 9px; cursor:pointer;
  border-radius:2px; white-space:nowrap; transition:all 0.15s; }
#toggle-timeline.active { background:rgba(212,168,67,0.22); border-color:#d4a843; }
#timeline-drawer { position:relative; flex:0 0 auto; height:44vh; min-height:200px;
  background:#0b0805; border-top:1px solid #5c3d0a; display:flex; flex-direction:column; }
#timeline-drawer[hidden] { display:none; }
body.tl-full #main-area { display:none; }
body.tl-full #timeline-drawer { flex:1; height:auto; }
.tl-nav { position:relative; flex:1; min-height:0; overflow-x:hidden; overflow-y:auto; cursor:grab;
  user-select:none; -webkit-user-select:none; touch-action:pan-y; font-family:"Georgia",serif; }
.tl-nav.drag { cursor:grabbing; }
.tl-nav::-webkit-scrollbar { width:5px; }
.tl-nav::-webkit-scrollbar-thumb { background:#3a2a0a; border-radius:2px; }
.tl-track { position:absolute; left:0; top:0; }
.tl-track.anim { transition:transform .4s ease; }
.tl-head { position:absolute; left:0; right:0; top:0; background:#0e0a05; border-bottom:1px solid #3a2a0a; z-index:3; }
.tl-era { position:absolute; top:4px; height:18px; line-height:18px; padding:0 6px; font-size:0.62rem;
  color:#f3e6c4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-radius:2px; opacity:.9; }
.tl-tick { position:absolute; height:20px; padding:4px 0 0 4px; border-left:1px solid #5c3d0a;
  font-size:0.6rem; color:#8a7050; white-space:nowrap; }
.tl-gridl { position:absolute; bottom:0; border-left:1px solid #1e160a; pointer-events:none; }
.tl-gband { position:absolute; left:0; right:0; border-top:1px dashed #2a1f0e; pointer-events:none; }
.tl-gband span { position:absolute; left:8px; top:1px; font-size:0.56rem; letter-spacing:0.08em;
  text-transform:uppercase; color:#6a5535; background:#0b0805; padding:0 4px; }
.tl-gband.tl-g-regione span, .tl-gband.tl-g-eventi span { color:#d4a843; }
.tl-gband.tl-g-regione { border-top:1px solid #5c3d0a; }
.tl-ev { position:absolute; height:28px; }
.tl-card { position:absolute; left:0; top:0; width:132px; height:26px; padding:2px 6px 2px 7px;
  background:#16100a; border:1px solid #2a1f0e; border-left:3px solid #d4a843; border-radius:0 3px 3px 0;
  font-size:0.62rem; line-height:1.2; white-space:nowrap; overflow:hidden; cursor:pointer; box-sizing:border-box; }
.tl-card:hover { background:#21180c; }
.tl-card b { display:block; font-weight:normal; color:#e8d9b0; overflow:hidden; text-overflow:ellipsis; }
.tl-card span { display:block; font-size:0.55rem; color:#7a6545; overflow:hidden; text-overflow:ellipsis; }
.tl-range { position:absolute; left:0; top:27px; height:3px; border-radius:2px; opacity:.55; }
.tl-ev.ind .tl-card { border-style:dashed; border-left-style:dashed; }
.tl-ev.ind .tl-range { opacity:.3; background-image:repeating-linear-gradient(90deg,transparent 0 4px,#0b0805 4px 7px) !important; }
.tl-cur { position:absolute; top:0; bottom:0; width:0; border-left:2px solid #e67e22; z-index:4; pointer-events:none; }
.tl-cur-h { position:absolute; left:-34px; width:68px; height:18px; line-height:18px; text-align:center;
  background:#e67e22; color:#0e0a05; font-size:0.6rem; font-weight:bold; border-radius:3px;
  pointer-events:auto; cursor:ew-resize; touch-action:none; white-space:nowrap; }
.tl-tools { position:absolute; right:10px; top:4px; z-index:6; display:flex; gap:4px; }
.tl-tools button { width:26px; height:24px; background:#0e0a05; border:1px solid #5c3d0a; color:#d4a843;
  border-radius:3px; cursor:pointer; font-size:0.85rem; line-height:1; padding:0; }
.tl-tools button.on { background:#d4a843; color:#0e0a05; }
.tl-info { position:absolute; right:10px; bottom:10px; z-index:6; width:min(320px, calc(100% - 20px));
  max-height:60%; overflow:auto; background:#0e0a05; border:1px solid #5c3d0a; border-radius:4px;
  padding:8px 10px; box-shadow:0 4px 18px rgba(0,0,0,.6); font-family:"Georgia",serif; }
.tl-info[hidden] { display:none; }
.tl-info-h { display:flex; justify-content:space-between; gap:8px; font-size:0.8rem; }
.tl-info-h b { font-weight:normal; }
.tl-info-h button { background:none; border:0; color:#8a7050; font-size:1rem; cursor:pointer; line-height:1; }
.tl-info-sub { font-size:0.6rem; color:#6a5535; font-style:italic; margin:2px 0 4px; }
.tl-info-note { font-size:0.66rem; color:#c8b890; line-height:1.45; }

/* ── MOBILE ─────────────────────────────────────────────────────── */
@media (max-width: 640px) {
  /* Fallback per browser senza dvh, poi sovrascrittura con dvh */
  body { height: 100vh; height: 100dvh; overflow: hidden; }

  /* Header compattato */
  header { padding:4px 10px; }
  header h1 { font-size:0.75rem; }
  header p  { display:none; }
  header > div:last-child { display:none; }

  /* Niente pannello sovrani */
  #rulers-panel { display:none; }

  /* Period bar: scroll orizzontale su una riga sola — NON wrappa */
  #period-bar {
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 4px 8px;
    gap: 4px;
    scrollbar-width: none;
  }
  #period-bar::-webkit-scrollbar { display: none; }
  .period-btn      { font-size:0.56rem; padding:3px 7px; }
  #btn-all-periods { font-size:0.56rem; padding:3px 7px; }
  #toggle-battles  { font-size:0.56rem; padding:3px 7px; }
  #toggle-routes   { font-size:0.56rem; padding:3px 7px; margin-left:0; }
  #toggle-timeline { font-size:0.56rem; padding:3px 7px; }
  #timeline-drawer { height:50vh; min-height:0; }

  /* Timeline */
  #timeline-bar { padding:5px 10px; gap:6px; }
  #year-label   { font-size:0.8rem; min-width:76px; }

  /* Event panel: solo titolo e anno */
  #event-panel  { padding:4px 10px; min-height:34px; }
  #event-desc, #event-tipo { display:none; }
}

/* Landscape molto basso */
@media (max-height: 480px) {
  #period-bar { display:none; }
  #event-panel { display:none !important; }
  header { padding:3px 10px; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>Vicino Oriente Antico</h1>
    <p id="header-stats">3500 – 300 a.C. &bull; Età del Bronzo e del Ferro</p>
  </div>
  <div style="font-size:0.6rem;color:#5a4020;font-style:italic;text-align:right;">
    Clicca le città &bull; Usa il cursore per navigare nel tempo
  </div>
</header>

<div id="main-area">
  <div id="map"></div>
  <!-- PANNELLO SOVRANI -->
  <div id="rulers-panel">
    <div id="rulers-panel-header">
      <h3>Sovrani attivi</h3>
      <div id="rulers-year-display">muovi il cursore temporale</div>
    </div>
    <div id="rulers-list">
      <div id="rulers-empty">Usa il cursore temporale<br>per vedere i sovrani<br>di ogni stato</div>
    </div>
  </div>
</div>

<!-- LINEA DEL TEMPO (timeline.js) -->
<div id="timeline-drawer" hidden></div>

<div id="period-bar">
  <button id="toggle-timeline" onclick="toggleTimeline()" title="Linea del tempo sinottica: periodi e sovrani per civiltà">&#9203; Linea del tempo</button>
  <button id="toggle-borders" class="active" onclick="toggleBorders(this)" title="Mostra/nascondi i confini dei regni nell'anno scelto">▦ Confini</button>
  <button id="btn-all-periods" class="active" onclick="selectPeriod(null,this)">Tutte le epoche</button>
  <button id="toggle-arch" onclick="toggleArch(this)" title="Mostra/nascondi scoperte archeologiche">⛏ Archeologia</button>
  <button id="toggle-battles" onclick="toggleBattles(this)" title="Mostra/nascondi battaglie e assedi">⚔ Battaglie</button>
  <button id="toggle-routes" onclick="toggleRoutes(this)" title="Mostra/nascondi le rotte commerciali">⚓ Rotte commerciali</button>
</div>

<div id="timeline-bar">
  <input type="range" id="year-slider" min="-3500" max="-300" step="10" value="-1200" oninput="onSlider(this.value)">
  <div id="year-label">&#8212;</div>
</div>

<div id="event-panel">
  <div id="event-dot"></div>
  <div id="event-body">
    <div id="event-title"></div>
    <div id="event-year-label"></div>
    <div id="event-desc"></div>
    <div id="event-tipo"></div>
  </div>
</div>

<script>
// ── MAPPA ────────────────────────────────────────────────────────────────────
var map = L.map("map", { center:[33, 40], zoom:5, minZoom:3, maxZoom:10 });
// Cartina piatta (Natural Earth 1:10m): terre, laghi e fiumi, senza confini moderni né nomi.
// Disegnata su canvas: con molti punti è più veloce dell'SVG.
map.createPane("basePane");    map.getPane("basePane").style.zIndex = 150;
map.createPane("bordersPane"); map.getPane("bordersPane").style.zIndex = 350;
map.createPane("bordersLabelPane"); map.getPane("bordersLabelPane").style.zIndex = 450;
map.getPane("bordersLabelPane").style.pointerEvents = "none";
var baseRenderer = L.canvas({ pane:"basePane", padding:0.5 });
L.geoJSON({ type:"GeometryCollection", geometries:BASEMAP.land },
  { renderer:baseRenderer, interactive:false, style:{ color:"#b9ad94", weight:0.7, fillColor:"#efe8d8", fillOpacity:1 } }).addTo(map);
L.geoJSON({ type:"GeometryCollection", geometries:BASEMAP.lakes },
  { renderer:baseRenderer, interactive:false, style:{ color:"#a9bfc8", weight:0.5, fillColor:"#cfdde3", fillOpacity:1 } }).addTo(map);
L.geoJSON({ type:"GeometryCollection", geometries:BASEMAP.rivers.map(function(r) { return { type:"LineString", coordinates:r.c }; }) },
  { renderer:baseRenderer, interactive:false, style:{ color:"#8fb0c0", weight:1.1, opacity:0.9 } }).addTo(map);
map.attributionControl.addAttribution("Natural Earth · confini: Cliopatria (CC BY 4.0)");

// ── STATO ────────────────────────────────────────────────────────────────────
var layerGroup = L.layerGroup().addTo(map);
var allMarkers = [];
var hiddenCivs = {};
var sliderActive = false;
var currentYear = -1200;
var currentPeriod = null;

var TIPO_ICONS = {
  battaglia: "⚔️", fondazione: "🏛️", distruzione: "🔥",
  trattato: "📜", disastro: "🌋", politico: "👑",
  culturale: "📚", scientifico: "🔭"
};

// ── STATI → ETICHETTE E COLORI ────────────────────────────────────────────────
var STATO_INFO = {
  egitto:         { label:"Egitto",         colore:"#f1c40f" },
  ittiti:         { label:"Ittiti",         colore:"#a0522d" },
  assiria:        { label:"Assiria",        colore:"#c07030" },
  babilonia:      { label:"Babilonia",      colore:"#8e44ad" },
  mitanni:        { label:"Mittani",        colore:"#16a085" },
  ugarit:         { label:"Ugarit",         colore:"#c8a000" },
  elam:           { label:"Elam",           colore:"#e74c3c" },
  karkemish:      { label:"Karkemish",      colore:"#795548" },
  urartu:         { label:"Urartu",         colore:"#9b59b6" },
  tiro:           { label:"Tiro",           colore:"#e67e22" },
  biblo:          { label:"Biblo",          colore:"#f39c12" },
  damasco:        { label:"Damasco",        colore:"#27ae60" },
  samal:          { label:"Sam'al",         colore:"#2ecc71" },
  israele_unito:  { label:"Israele unito",  colore:"#3498db" },
  israele:        { label:"Israele (Nord)", colore:"#2980b9" },
  giuda:          { label:"Giuda (Sud)",    colore:"#1abc9c" },
  moab:           { label:"Moab",           colore:"#95a5a6" },
  edom:           { label:"Edom",           colore:"#7f8c8d" },
  ur:             { label:"Ur III",         colore:"#b07cc6" },
  hyksos:         { label:"Hyksos",         colore:"#c9a227" },
  patina:         { label:"Patina (Kunulua)", colore:"#8d6e63" },
  amurru:         { label:"Amurru",         colore:"#b8a040" },
  anatolia_occ:   { label:"Anatolia occidentale", colore:"#b5651d" },
  persiana:       { label:"Persia achemenide", colore:"#1abc9c" }
};

// ── PERIODO BUTTONS ───────────────────────────────────────────────────────────
var periodBar = document.getElementById("period-bar");
PERIODS.forEach(function(p) {
  var btn = document.createElement("button");
  btn.className = "period-btn";
  btn.textContent = p.short;
  btn.title = p.label + " (" + formatYear(p.min) + " – " + formatYear(p.max) + ")";
  btn.addEventListener("click", function() { selectPeriod(p, btn); });
  periodBar.appendChild(btn);
});

function selectPeriod(p, btn) {
  currentPeriod = p;
  document.querySelectorAll(".period-btn, #btn-all-periods").forEach(function(b) { b.classList.remove("active"); });
  btn.classList.add("active");
  if (p) {
    sliderActive = true;
    var slider = document.getElementById("year-slider");
    slider.min = p.min; slider.max = p.max; slider.value = p.mid;
    onSlider(p.mid);
    Timeline.zoomTo(p.min, p.max);
    document.getElementById("event-panel").classList.add("visible");
  } else {
    sliderActive = false;
    document.getElementById("year-slider").min = -3500;
    document.getElementById("year-slider").max = -300;
    document.getElementById("year-label").textContent = "—";
    document.getElementById("event-panel").classList.remove("visible");
    updateVisibility();
    renderRulers(null);
    renderRoutes(null);
    renderBattles(null);
  }
}

// ── SLIDER ────────────────────────────────────────────────────────────────────
document.getElementById("year-slider").addEventListener("mousedown", function() {
  sliderActive = true;
  document.getElementById("event-panel").classList.add("visible");
});
document.getElementById("year-slider").addEventListener("touchstart", function() {
  sliderActive = true;
  document.getElementById("event-panel").classList.add("visible");
});

function onSlider(val) {
  currentYear = parseInt(val);
  sliderActive = true;
  document.getElementById("year-label").textContent = formatYear(currentYear);
  // Trova l'evento globale più vicino entro 100 anni
  var nearest = null, bestDist = 999999;
  EVENTS.forEach(function(e) {
    if (e.livello !== "globale") return;
    var d = Math.abs(e.anno - currentYear);
    if (d < bestDist) { bestDist = d; nearest = e; }
  });
  if (nearest && bestDist <= 100) {
    document.getElementById("event-dot").style.display = "block";
    document.getElementById("event-title").textContent = nearest.titolo;
    document.getElementById("event-year-label").textContent = formatYear(nearest.anno);
    document.getElementById("event-desc").textContent = nearest.desc;
    document.getElementById("event-tipo").textContent = (TIPO_ICONS[nearest.tipo] || "") + " " + nearest.tipo;
  } else {
    document.getElementById("event-dot").style.display = "none";
    document.getElementById("event-title").textContent = "";
    document.getElementById("event-year-label").textContent = "";
    document.getElementById("event-desc").textContent = "Nessun evento di rilievo in questo periodo.";
    document.getElementById("event-tipo").textContent = "";
  }
  updateVisibility();
  renderRulers(currentYear);
  renderRoutes(currentYear);
  renderBattles(currentYear);
  renderBorders(currentYear);
  Timeline.setYear(currentYear);
}

function formatYear(y) {
  if (y < 0) return Math.abs(y) + " a.C.";
  if (y === 0) return "1 d.C.";
  return y + " d.C.";
}
function isActive(city, year) { return city.start <= year && city.end >= year; }

// ── PANNELLO SOVRANI ──────────────────────────────────────────────────────────
function renderRulers(year) {
  var list = document.getElementById("rulers-list");
  var ydisp = document.getElementById("rulers-year-display");
  if (year === null) {
    list.innerHTML = "<div id='rulers-empty'>Usa il cursore temporale<br>per vedere i sovrani<br>di ogni stato</div>";
    ydisp.textContent = "muovi il cursore temporale";
    return;
  }
  ydisp.textContent = "attivi nel " + formatYear(year);
  // Filtra sovrani attivi
  var active = RULERS.filter(function(r) {
    return r.inizio <= year && r.fine >= year;
  });
  if (active.length === 0) {
    list.innerHTML = "<div id='rulers-empty'>Nessun sovrano documentato<br>per questo anno</div>";
    return;
  }
  // Raggruppa per stato
  var byStato = {};
  active.forEach(function(r) {
    if (!byStato[r.stato]) byStato[r.stato] = [];
    byStato[r.stato].push(r);
  });
  // Ordine preferenziale degli stati (grandi potenze prima)
  var statiOrder = ["egitto","hyksos","ittiti","assiria","ur","babilonia","mitanni","persiana",
                    "ugarit","amurru","elam","karkemish","patina","urartu","anatolia_occ","tiro","biblo","damasco",
                    "samal","israele_unito","israele","giuda","moab","edom"];
  var statiAttivi = Object.keys(byStato).sort(function(a,b) {
    var ia = statiOrder.indexOf(a), ib = statiOrder.indexOf(b);
    if (ia === -1) ia = 99; if (ib === -1) ib = 99;
    return ia - ib;
  });
  var html = "";
  statiAttivi.forEach(function(stato) {
    var info = STATO_INFO[stato] || { label: stato, colore: "#888" };
    html += "<div class='ruler-state-group'>";
    html += "<div class='ruler-state-name'>" + info.label + "</div>";
    byStato[stato].forEach(function(r) {
      html += "<div class='ruler-entry'>";
      html += "<div class='ruler-dot' style='background:" + info.colore + "'></div>";
      html += "<div class='ruler-info'>";
      html += "<div class='ruler-name'>" + r.nome + "</div>";
      html += "<div class='ruler-dates'>" + formatYear(r.inizio) + " – " + formatYear(r.fine) + (r.ind ? " · date indicative" : "") + "</div>";
      if (r.note) html += "<div class='ruler-note'>" + r.note + "</div>";
      html += "</div>";
      html += "</div>";
    });
    html += "</div>";
  });
  list.innerHTML = html;
}

// ── POPUP ─────────────────────────────────────────────────────────────────────
function getCityEvents(cityId) {
  return EVENTS.filter(function(e) {
    return e.livello === "locale" && e.city === cityId;
  }).sort(function(a,b) { return a.anno - b.anno; });
}

function makePopup(city, civ) {
  var uid = city.id;
  var h = "";
  h += "<div class='popup-title'>" + city.name + "</div>";
  if (city.modern) h += "<div class='popup-modern'>Oggi: " + city.modern + "</div>";
  h += "<div class='popup-badges'>";
  h += "<span class='popup-badge' style='color:" + civ.color + ";border-color:" + civ.color + "40'>" + civ.label + "</span>";
  if (city.tipo) h += "<span class='popup-badge' style='color:#8a7050;border-color:#3a2a0a'>" + city.tipo.replace("_"," ") + "</span>";
  if (city.unesco) h += "<span class='popup-badge' style='color:#a0c0e0;border-color:#2a4060'>UNESCO</span>";
  h += "</div>";
  if (city.wiki) {
    h += "<div id='wslot-" + uid + "'><div style='font-size:0.6rem;color:#4a3820;font-style:italic;margin-bottom:4px;'>Caricamento immagine…</div></div>";
  }
  h += "<div class='popup-desc'>" + city.desc + "</div>";
  h += "<div class='popup-era'>" + city.era + "</div>";
  if (city.museum) h += "<div class='popup-museum'>" + city.museum + "</div>";
  var localEvts = getCityEvents(uid);
  if (localEvts.length > 0) {
    h += "<div class='popup-events'>";
    h += "<div class='popup-events-title'>Eventi storici</div>";
    localEvts.forEach(function(e) {
      h += "<div class='popup-event-item'>";
      h += "<span>" + formatYear(e.anno) + " — " + (TIPO_ICONS[e.tipo]||"") + "</span> " + e.titolo;
      h += "</div>";
    });
    h += "</div>";
  }
  if (city.wiki) {
    h += "<div class='popup-wiki'><a href='https://it.wikipedia.org/wiki/" + encodeURIComponent(city.wiki.replace(/_/g," ")) + "' target='_blank'>Wikipedia →</a></div>";
  }
  return h;
}

function fetchWikiImage(cityId, cityWiki) {
  if (!cityWiki) return;
  fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(cityWiki))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var slot = document.getElementById("wslot-" + cityId);
      if (!slot) return;
      if (data.thumbnail && data.thumbnail.source) {
        var img = document.createElement("img");
        img.className = "popup-img";
        img.src = data.thumbnail.source;
        img.alt = "immagine";
        slot.innerHTML = "";
        slot.appendChild(img);
      } else {
        slot.innerHTML = "";
      }
    })
    .catch(function() {
      var slot = document.getElementById("wslot-" + cityId);
      if (slot) slot.innerHTML = "";
    });
}

// ── MARKERS ───────────────────────────────────────────────────────────────────
function createMarker(city) {
  var civ = CIVS[city.civ] || { label: city.civ, color: "#888" };
  var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16'>"
          + "<circle cx='8' cy='8' r='6' fill='" + civ.color + "' fill-opacity='0.88' stroke='rgba(255,255,255,0.45)' stroke-width='1'/>"
          + "</svg>";
  var icon = L.divIcon({ className:"", html:svg, iconSize:[16,16], iconAnchor:[8,8] });
  var marker = L.marker([city.lat, city.lng], { icon:icon });
  marker.bindPopup(makePopup(city, civ), { maxWidth:270 });
  marker.on("popupopen", function() { fetchWikiImage(city.id, city.wiki); });
  return marker;
}

CITIES.forEach(function(city) {
  var m = createMarker(city);
  allMarkers.push({ marker:m, civ:city.civ, city:city });
  layerGroup.addLayer(m);
});

// ── VISIBILITÀ ────────────────────────────────────────────────────────────────
function updateVisibility() {
  var visible = 0;
  allMarkers.forEach(function(item) {
    var show = !hiddenCivs[item.civ];
    if (sliderActive) show = show && isActive(item.city, currentYear);
    if (show) {
      if (!layerGroup.hasLayer(item.marker)) layerGroup.addLayer(item.marker);
      visible++;
    } else {
      if (layerGroup.hasLayer(item.marker)) layerGroup.removeLayer(item.marker);
    }
  });
  Object.keys(CIVS).forEach(function(key) {
    var el = document.getElementById("cnt-" + key);
    if (!el) return;
    var n = allMarkers.filter(function(m) {
      return m.civ === key && (!sliderActive || isActive(m.city, currentYear));
    }).length;
    el.textContent = "(" + n + ")";
  });
  document.getElementById("header-stats").textContent =
    visible + " città visibili" + (sliderActive ? " nel " + formatYear(currentYear) : "");
}

// ── ARCHEOLOGIA ──────────────────────────────────────────────────────────────
var archLayer = L.layerGroup();
var archVisible = false;

function archSVG() {
  return "<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 18 18'>"
    + "<rect x='2' y='2' width='14' height='14' rx='2'"
    + " fill='#1a3020' fill-opacity='0.92' stroke='#a0d0a0' stroke-width='1.5'/>"
    + "<text x='9' y='13.5' text-anchor='middle' font-size='10' fill='#a0d0a0'>⛏</text>"
    + "</svg>";
}

function makeArchPopup(a) {
  var h = "";
  h += "<div class='arch-popup-title'>" + a.nome + "</div>";
  h += "<div class='arch-popup-chi'>Scoperto nel " + a.scoperta.anno + " da " + a.scoperta.chi
     + "<br><span style='color:#3a5030'>" + a.scoperta.istituzione + "</span></div>";
  if (a.trova && a.trova.length) {
    h += "<div class='arch-popup-trova'>";
    a.trova.forEach(function(t) {
      h += "<div class='arch-popup-trovato'>";
      h += "<div class='arch-popup-trovato-nome'>📦 " + t.nome + "</div>";
      if (t.museo) h += "<div class='arch-popup-trovato-museo'>→ " + t.museo + "</div>";
      if (t.nota) h += "<div class='arch-popup-trovato-nota'>" + t.nota + "</div>";
      h += "</div>";
    });
    h += "</div>";
  }
  h += "<div class='arch-popup-desc'>" + a.desc + "</div>";
  if (a.wiki) {
    h += "<div style='margin-top:5px'><a href='https://it.wikipedia.org/wiki/"
       + encodeURIComponent(a.wiki) + "' target='_blank'"
       + " style='font-size:0.62rem;color:#5a80a0'>Wikipedia →</a></div>";
  }
  return h;
}

function renderArch() {
  archLayer.clearLayers();
  if (!archVisible) return;
  ARCHAEOLOGY.forEach(function(a) {
    var icon = L.divIcon({ className:"", html:archSVG(), iconSize:[18,18], iconAnchor:[9,9] });
    var marker = L.marker([a.lat, a.lng], { icon:icon });
    marker.bindPopup(makeArchPopup(a), { maxWidth:310 });
    archLayer.addLayer(marker);
  });
}

function toggleArch(btn) {
  archVisible = !archVisible;
  btn.classList.toggle("active", archVisible);
  if (archVisible) { archLayer.addTo(map); renderArch(); }
  else { map.removeLayer(archLayer); }
}

// ── BATTAGLIE ────────────────────────────────────────────────────────────────
var battleLayer = L.layerGroup();
var battlesVisible = false;

function battleSVG(tipo) {
  // Spada incrociata per battaglia, torre per assedio
  if (tipo === "assedio") {
    return "<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22' viewBox='0 0 22 22'>"
      + "<polygon points='11,1 21,21 1,21' fill='#c0392b' fill-opacity='0.9' stroke='#fff' stroke-width='1.2'/>"
      + "<text x='11' y='17' text-anchor='middle' font-size='10' fill='#fff'>🏰</text>"
      + "</svg>";
  }
  return "<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22' viewBox='0 0 22 22'>"
    + "<polygon points='11,1 21,21 1,21' fill='#e74c3c' fill-opacity='0.92' stroke='#fff' stroke-width='1.2'/>"
    + "<text x='11' y='17' text-anchor='middle' font-size='10' fill='#fff'>⚔</text>"
    + "</svg>";
}

function makeBattlePopup(b) {
  var h = "";
  h += "<div class='battle-popup-title'>" + b.nome + "</div>";
  h += "<div class='battle-popup-anno'>" + formatYear(b.anno) + "</div>";
  h += "<div class='battle-popup-fazioni'>";
  b.fazioni.forEach(function(f) {
    h += "<div class='battle-popup-fazione'>"
       + "<span class='battle-popup-ruolo ruolo-" + f.ruolo + "'>" + f.ruolo + "</span>"
       + f.nome
       + "</div>";
  });
  h += "</div>";
  h += "<div class='battle-popup-esito'>" + b.esito + "</div>";
  h += "<div class='battle-popup-desc'>" + b.desc + "</div>";
  if (b.significato) h += "<div class='battle-popup-sig'>" + b.significato + "</div>";
  if (b.fonte) h += "<div class='battle-popup-fonte'>Fonte: " + b.fonte + "</div>";
  return h;
}

function renderBattles(year) {
  battleLayer.clearLayers();
  if (!battlesVisible) return;
  BATTLES.forEach(function(b) {
    var show = (year === null) || (Math.abs(b.anno - year) <= 150);
    if (!show) return;
    var opacity = year === null ? 1 : Math.max(0.3, 1 - Math.abs(b.anno - year) / 150);
    var icon = L.divIcon({
      className: "",
      html: "<div style='opacity:" + opacity + "'>" + battleSVG(b.tipo) + "</div>",
      iconSize: [22, 22],
      iconAnchor: [11, 22]
    });
    var marker = L.marker([b.lat, b.lng], { icon: icon });
    marker.bindPopup(makeBattlePopup(b), { maxWidth: 300 });
    battleLayer.addLayer(marker);
  });
}

function toggleBattles(btn) {
  battlesVisible = !battlesVisible;
  btn.classList.toggle("active", battlesVisible);
  if (battlesVisible) {
    battleLayer.addTo(map);
  } else {
    map.removeLayer(battleLayer);
  }
  renderBattles(sliderActive ? currentYear : null);
}

// ── ROTTE COMMERCIALI ────────────────────────────────────────────────────────
var routeLayer = L.layerGroup();
var routesVisible = false;
var routePolylines = [];

var TIPO_DASH = {
  marittimo:  [8, 6],
  terrestre:  [1, 0],
  fluviale:   [4, 3]
};
var TIPO_LABEL = {
  marittimo: "Rotta marittima",
  terrestre: "Via terrestre",
  fluviale:  "Via fluviale"
};

function makeRoutePopup(r) {
  var h = "";
  h += "<div class='route-popup-title'>" + r.nome + "</div>";
  h += "<div class='route-popup-tipo'>" + (TIPO_LABEL[r.tipo]||r.tipo)
     + " &bull; " + formatYear(r.periodo_min) + " – " + formatYear(r.periodo_max) + "</div>";
  h += "<div class='route-popup-merci'>";
  r.merci.forEach(function(m) {
    var cat = ROUTE_CATEGORIE[m.cat] || {};
    h += "<div class='route-popup-merce'>";
    h += "<div class='route-popup-merce-icon'>" + (m.icona||"") + "</div>";
    h += "<div class='route-popup-merce-body'>";
    h += "<div class='route-popup-merce-nome'>" + m.nome
       + " <span style='font-size:0.6rem;color:" + (cat.colore||"#888") + ";font-weight:normal;'>"
       + (cat.label||"") + "</span></div>";
    if (m.note) h += "<div class='route-popup-merce-note'>" + m.note + "</div>";
    h += "</div></div>";
  });
  h += "</div>";
  if (r.desc) h += "<div class='route-popup-desc'>" + r.desc + "</div>";
  if (r.fonte) h += "<div class='route-popup-fonte'>Fonte: " + r.fonte + "</div>";
  return h;
}

function buildRoutePolylines() {
  routePolylines = [];
  ROUTES.forEach(function(r) {
    var dash = TIPO_DASH[r.tipo] || [1,0];
    var pl = L.polyline(r.waypoints, {
      color: r.colore,
      weight: r.tipo === "fluviale" ? 3 : 2.5,
      opacity: 0.75,
      dashArray: dash.join(","),
      lineJoin: "round"
    });
    pl.bindPopup(makeRoutePopup(r), { maxWidth: 290 });
    // Freccia direzionale sull'ultima metà della rotta
    pl.on("add", function() { addRouteArrow(r, pl); });
    routePolylines.push({ pl: pl, route: r });
  });
}

function addRouteArrow(r, pl) {
  // Piccolo marker a metà rotta come etichetta
  var mid = r.waypoints[Math.floor(r.waypoints.length / 2)];
  var iconHtml = "<div style='background:" + r.colore + ";border-radius:3px;"
    + "padding:1px 5px;font-size:0.58rem;color:#fff;white-space:nowrap;"
    + "box-shadow:0 1px 4px rgba(0,0,0,0.5);font-family:Georgia,serif;opacity:0.9'>"
    + r.merci.map(function(m){ return m.icona; }).join(" ")
    + "</div>";
  var labelIcon = L.divIcon({ className:"", html:iconHtml,
    iconAnchor:[0,10], iconSize:[null,20] });
  var lm = L.marker(mid, { icon:labelIcon, interactive:false, keyboard:false });
  routeLayer.addLayer(lm);
}

function renderRoutes(year) {
  routeLayer.clearLayers();
  if (!routesVisible) return;
  routePolylines.forEach(function(item) {
    var r = item.route;
    var show = (year === null) || (r.periodo_min <= year && r.periodo_max >= year);
    if (show) {
      routeLayer.addLayer(item.pl);
      addRouteArrow(r, item.pl);
    }
  });
}

function toggleRoutes(btn) {
  routesVisible = !routesVisible;
  btn.classList.toggle("active", routesVisible);
  var legendSec = document.getElementById("legend-routes-section");
  if (legendSec) legendSec.style.display = routesVisible ? "block" : "none";
  if (routesVisible) {
    routeLayer.addTo(map);
  } else {
    map.removeLayer(routeLayer);
  }
  renderRoutes(sliderActive ? currentYear : null);
}

buildRoutePolylines();

// ── LEGENDA ───────────────────────────────────────────────────────────────────
var legend = L.control({ position:"bottomleft" });
legend.onAdd = function() {
  var div = L.DomUtil.create("div", "legend");
  div.innerHTML = "<h4>Civiltà</h4>";
  Object.keys(CIVS).forEach(function(key) {
    var civ = CIVS[key];
    var count = CITIES.filter(function(c) { return c.civ === key; }).length;
    if (count === 0) return;
    var item = document.createElement("div");
    item.className = "legend-item";
    item.title = civ.desc;
    item.innerHTML = "<div class='legend-dot' style='background:" + civ.color + "'></div>"
      + "<span>" + civ.label + " <span id='cnt-" + key + "' style='color:#4a3820'>(" + count + ")</span></span>";
    item.addEventListener("click", function() {
      if (hiddenCivs[key]) { delete hiddenCivs[key]; item.classList.remove("dim"); }
      else { hiddenCivs[key] = true; item.classList.add("dim"); }
      updateVisibility();
    });
    div.appendChild(item);
  });
  // Sezione rotte commerciali
  var routeSection = document.createElement("div");
  routeSection.id = "legend-routes-section";
  routeSection.style.cssText = "margin-top:8px;padding-top:7px;border-top:1px solid #3a2a0a;display:none;";
  routeSection.innerHTML = "<h4 style='margin-bottom:5px;'>Rotte commerciali</h4>";
  Object.keys(ROUTE_CATEGORIE).forEach(function(k) {
    var cat = ROUTE_CATEGORIE[k];
    var ri = document.createElement("div");
    ri.className = "legend-route-item";
    ri.innerHTML = "<div class='legend-route-line' style='background:" + cat.colore + "'></div>"
      + "<span>" + cat.icona + " " + cat.label + "</span>";
    routeSection.appendChild(ri);
  });
  div.appendChild(routeSection);

  var footer = document.createElement("div");
  footer.style.cssText = "margin-top:7px;padding-top:6px;border-top:1px solid #3a2a0a;";
  footer.innerHTML = "<span style='font-size:0.6rem;color:#8a7050;cursor:pointer;text-transform:uppercase;letter-spacing:0.05em;'>Mostra tutte</span>";
  footer.querySelector("span").addEventListener("click", function() {
    hiddenCivs = {};
    document.querySelectorAll(".legend-item").forEach(function(el) { el.classList.remove("dim"); });
    updateVisibility();
  });
  div.appendChild(footer);
  return div;
};
legend.addTo(map);

// ── CONFINI DEI REGNI (Cliopatria) ────────────────────────────────────────────
// Sempre visibili: mostrano i regni dell'anno dello slider (anche con "Tutte le epoche").
var bordersLayer = L.layerGroup().addTo(map);
var bordersOn = true, bordersKey = null;
var bordersBadge = L.control({ position:"topright" });
bordersBadge.onAdd = function() { this._div = L.DomUtil.create("div", "borders-badge"); return this._div; };
bordersBadge.addTo(map);

function borderColor(c) { return (CIVS[c] && CIVS[c].color) || c; }
// punto per l'etichetta: baricentro dell'anello più grande
function labelPoint(g) {
  var best = null, bestA = 0;
  g.forEach(function(poly) {
    var r = poly[0], a = 0, cx = 0, cy = 0;
    for (var i = 0, j = r.length - 1; i < r.length; j = i++) {
      var f = r[j][0] * r[i][1] - r[i][0] * r[j][1];
      a += f; cx += (r[j][0] + r[i][0]) * f; cy += (r[j][1] + r[i][1]) * f;
    }
    if (Math.abs(a) > bestA) { bestA = Math.abs(a); best = [cy / (3 * a), cx / (3 * a)]; }
  });
  return best;
}
function borderPopup(b) {
  var h = "<div class='border-popup-title'>" + b.n + "</div>";
  h += "<div class='border-popup-years'>confini " + formatYear(b.from) + " – " + formatYear(b.to) + " · " + b.km2.toLocaleString("it-IT") + " km²</div>";
  if (b.wiki) h += "<div class='popup-wiki'><a href='https://en.wikipedia.org/wiki/" + encodeURIComponent(b.wiki) + "' target='_blank'>Wikipedia (" + b.en + ") →</a></div>";
  h += "<div class='border-popup-src'>Confini indicativi da <a href='https://github.com/Seshat-Global-History-Databank/cliopatria' target='_blank'>Cliopatria</a> (Seshat), CC BY 4.0</div>";
  return h;
}
function renderBorders(year) {
  var act = bordersOn ? BORDERS.filter(function(b) { return b.from <= year && b.to >= year; }) : [];
  bordersBadge._div.innerHTML = bordersOn ? "Confini al <b>" + formatYear(year) + "</b> · " + act.length + " regni" : "";
  bordersBadge._div.style.display = bordersOn ? "" : "none";
  var key = act.map(function(b) { return b.en + b.from; }).join("|");
  if (key === bordersKey) return;
  bordersKey = key;
  bordersLayer.clearLayers();
  act.forEach(function(b) {                       // dal più grande al più piccolo: i piccoli restano sopra
    var col = borderColor(b.c);
    var poly = L.geoJSON({ type:"MultiPolygon", coordinates:b.g },
      { pane:"bordersPane", style:{ color:col, weight:1.4, opacity:0.85, fillColor:col, fillOpacity:0.2 } });
    poly.bindPopup(borderPopup(b), { maxWidth:270 });
    bordersLayer.addLayer(poly);
    if (b.km2 >= 15000) {
      var p = labelPoint(b.g);
      if (p) bordersLayer.addLayer(L.marker(p, { pane:"bordersLabelPane", interactive:false, keyboard:false,
        icon:L.divIcon({ className:"", html:"<div class='border-label'>" + b.n + "</div>", iconSize:null }) }));
    }
  });
}
function toggleBorders(btn) {
  bordersOn = !bordersOn;
  btn.classList.toggle("active", bordersOn);
  bordersKey = null;
  renderBorders(currentYear);
}
renderBorders(currentYear);

// ── LINEA DEL TEMPO ───────────────────────────────────────────────────────────
// L'anno scelto sulla linea del tempo diventa l'anno della mappa (e viceversa, da onSlider).
function setYearFromTimeline(y) {
  var slider = document.getElementById("year-slider");
  if (y < +slider.min || y > +slider.max) {          // fuori dall'epoca scelta: torna a tutte le epoche
    currentPeriod = null;
    document.querySelectorAll(".period-btn").forEach(function(b) { b.classList.remove("active"); });
    document.getElementById("btn-all-periods").classList.add("active");
    slider.min = -3500; slider.max = -300;
  }
  slider.value = y;
  document.getElementById("event-panel").classList.add("visible");
  onSlider(y);
}
Timeline.init({
  el: "timeline-drawer",
  statoInfo: STATO_INFO,
  onYear: setYearFromTimeline,
  onPick: function(x) {
    setYearFromTimeline(x.t);
    if (x.city) {                                       // evento legato a una città: vola lì e apri la scheda
      var m = allMarkers.find(function(a) { return a.city.id === x.city; });
      if (m) { map.flyTo([m.city.lat, m.city.lng], Math.max(map.getZoom(), 6)); setTimeout(function() { m.marker.openPopup(); }, 900); }
    } else if (x.lat != null) {
      map.flyTo([x.lat, x.lng], Math.max(map.getZoom(), 6));
    }
  },
  onClose: function() { toggleTimeline(false); },
  onFull: function() { setTimeout(function() { map.invalidateSize(); }, 50); }
});
function toggleTimeline(force) {
  var open = force !== undefined ? force : !Timeline.isOpen();
  document.getElementById("toggle-timeline").classList.toggle("active", open);
  if (open) Timeline.show(); else Timeline.hide();
  setTimeout(function() { map.invalidateSize(); }, 50);
}
</script>
