<style>
* { margin:0; padding:0; box-sizing:border-box; }

ca, rivale di Roma. Conquistata da Camillo nel 396 a.C. dopo dieci anni di assedio.", "era": "IX – IV sec. a.C.", "img": "Apollo_Veio.jpg", "museum": "Museo Nazionale Etrusco di Villa Giulia, Roma — Apollo di Veio"}, {"name": "Tarquinia", "modern": null, "lat": 42.25, "lng": 11.77, "civ": "etrusca", "start": -900, "end": -200, "desc": "Una delle dodici città della Lega Etrusca. Famosa per le necropoli dipinte (UNESCO).", "era": "IX – II sec. a.C.", "img": "Tomba_dei_Leopardi.jpg", "museum": "Museo Nazionale Tarquiniese — Tomba dei Leopardi e Tomba della Caccia e Pesca in loco"}, {"name": "Cerveteri", "modern": null, "lat": 41.99, "lng": 12.1, "civ": "etrusca", "start": -900, "end": -200, "desc": "Caere. La Necropoli della Banditaccia riproduce una città con strade e tumuli (UNESCO).", "era": "IX – II sec. a.C.", "img": "Sarcofago_degli_Sposi.jpg", "museum": "Museo Nazionale Cerite — Louvre e Villa Giulia: Sarcofago degli Sposi"}, {"name": "Volterra", "modern": null, "lat": 43.4, "lng": 10.86, "civ": "etrusca", "start": -800, "end": -80, "desc": "Velathri. Importante centro etrusco dell’entroterra toscano, celebre per le urne cinerarie in alabastro.", "era": "VIII – I sec. a.C.", "img": null, "museum": "Museo Etrusco Guarnacci, Volterra"}, {"name": "Populonia", "modern": null, "lat": 42.99, "lng": 10.49, "civ": "etrusca", "start": -900, "end": -200, "desc": "Unica città etrusca affacciata direttamente sul mare. Importante centro metallurgico del ferro elbano.", "era": "IX – II sec. a.C.", "img": null, "museum": "Museo Gasparri, Populonia"}, {"name": "Fiesole", "modern": null, "lat": 43.8, "lng": 11.29, "civ": "etrusca", "start": -700, "end": -90, "desc": "Faesulae, città etrusca sulle colline fiorentine con teatro romano e resti etruschi sovrapposti.", "era": "VII – I sec. a.C.", "img": null, "museum": "Museo Civico Archeologico di Fiesole"}, {"name": "Babilonia", "modern": "Al-Hillah (Iraq)", "lat": 32.54, "lng": 44.42, "civ": "mesopotamica", "start": -2300, "end": 180, "desc": "Capitale dell’Impero Ittita nel cuore dell’Anatolia. Porta dei Leoni, Grande Tempio. UNESCO.", "era": "2000 – 1180 a.C.", "img": "Hattusa_Lion_Gate.jpg", "museum": "Museum of Anatolian Civilizations, Ankara — la più grande collezione ittita al mondo"}, {"name": "Karkemish", "modern": "Kargımş (Turchia/Siria)", "lat": 36.83, "lng": 38.01, "civ": "ittita", "start": -2400, "end": -717, "desc": "Importante città sull’Eufrate, capitale del tardo impero ittita dopo la caduta di Hattusa.", "era": "2400 – 717 a.C.", "img": null, "museum": "Museum of Anatolian Civilizations, Ankara"}, {"name": "Kanesh", "modern": "Kültepe (Turchia)", "lat": 38.85, "lng": 35.63, "civ": "ittita", "start": -2500, "end": -1700, "desc": "Kültepe. Centro commerciale con colonie di mercanti assiri (karum). Qui la scrittura arriva in Anatolia.", "era": "2500 – 1700 a.C.", "img": null, "museum": "Museum of Anatolian Civilizations, Ankara — tavolette commerciali del karum"}, {"name": "Qadesh", "modern": "Tell Nebi Mend (Siria)", "lat": 34.55, "lng": 36.52, "civ": "ittita", "start": -1500, "end": -1200, "desc": "Teatro della battaglia del 1274 a.C. tra Ramesse II e Muwatalli II. Il più antico trattato di pace documentato. Una copia è all’ONU a New York.", "era": "1500 – 1200 a.C.", "img": null, "museum": "Museo Egizio del Cairo — Ramesseum, Luxor — copia del trattato all’ONU, New York"}, {"name": "Alaca Höyük", "modern": "Alaca (Turchia)", "lat": 40.23, "lng": 34.68, "civ": "ittita", "start": -2500, "end": -1200, "desc": "Importante centro anatolico pre-ittita poi ittita. Celebri le tombe reali del Bronzo Antico con ori e argenti.", "era": "2500 – 1200 a.C.", "img": null, "museum": "Museum of Anatolian Civilizations, Ankara"}, {"name": "Micene", "modern": "Micene (Grecia)", "lat": 37.73, "lng": 22.76, "civ": "micenea", "start": -2000, "end": -1100, "desc": "Capitale dell’Egeo nel Bronzo Tardo. Porta dei Leoni, Tesoro di Atreo. Patria mitica di Agamennone.", "era": "2000 – 1100 a.C.", "img ": 35.57, "civ": "cananea", "start": -2700, "end": -732, "desc": "La più grande città cananea, che dominava le rotte tra Egitto e Mesopotamia. UNESCO.", "era": "2700 – 732 a.C.", "img": null, "museum": "Museo di Israel, Gerusalemme"}, {"name": "Megiddo", "modern": "Tel Megiddo (Israele)", "lat": 32.58, "lng": 35.18, "civ": "cananea", "start": -3500, "end": -500, "desc": "Armageddon. Nodo strategico cruciale per 3000 anni, teatro di battaglie da Thutmosi III a Napoleone. UNESCO.", "era": "3500 – 500 a.C.", "img": null, "museum": "Oriental Institute, Chicago — sito UNESCO in loco"}, {"name": "Gerico", "modern": "Ariha (Palestina)", "lat": 31.87, "lng": 35.44, "civ": "cananea", "start": -9000, "end": 200, "desc": "Una delle città abitate più antiche del mondo. La torre neolitica di Gerico risale al 8000 a.C.", "era": "IX millennio a.C.", "img": null, "museum": "Rockefeller Archaeological Museum, Gerusalemme"}]</script>

  baseLayer = L.tileLayer(p.url, p.opts);
  var timer = setTimeout(function() {
    if (document.querySelectorAll(".leaflet-tile-loaded").length === 0) { tileIdx++; tryNextTile(); }
  }, 4000);
  baseLayer.on("tileload", function() { clearTimeout(timer); });
  baseLayer.on("tileerror", function() { clearTimeout(timer); tileIdx++; tryNextTile(); });
  baseLayer.addTo(map);
}
tryNextTile();

var layerGroup = L.layerGroup().addTo(map);
var allMarkers = [];
var hiddenCivs = {};
var currentMode = "all";
var currentYear = -1200;

var periods = [
  { label:"Neolitico / Calcolitico", min:-9000, max:-3500 },
  { label:"Bronzo Antico",  min:-3500, max:-2000 },
  { label:"Bronzo Medio",   min:-2000, max:-1550 },
  { label:"Bronzo Tardo",   min:-1550, max:-1200 },
  { label:"Prima Et\u00e0 del Ferro", min:-1200, max:-800 },
  { label:"Et\u00e0 Arcaica",   min:-800, max:-500 },
  { label:"Et\u00e0 Classica",   min:-500, max:-323 },
  { label:"Et\u00e0 Ellenistica", min:-323, max:-31 },
  { label:"Et\u00e0 Imperiale",  min:-31, max:476 }
];

function getPeriodLabel(y) {
  for (var i=0; i<periods.length; i++)
    if (y >= periods[i].min && y <= periods[i].max) return periods[i].label;
  return "";
}
function formatYear(y) {
  if (y < 0) return Math.abs(y) + " a.C.";
  if (y === 0) return "1 d.C.";
  return y + " d.C.";
}
function isActive(city, year) { return city.start <= year && city.end >= year; }

function makePopup(city, civ) {
  var imgBase = "https://commons.wikimedia.org/wiki/Special:FilePath/";
  var html = "";
  html += "<div class='popup-title'>" + city.name + "</div>";
  if (city.modern) html += "<div class='popup-modern'>Oggi: " + city.modern + "</div>";
  html += "<div class='popup-civ' style='color:" + civ.color + "'>" + civ.label + "</div>";
  if (city.img) {
    html += "<img class='popup-img' src='" + imgBase + encodeURIComponent(city.img) + "?width=240'"
          + " onerror=\"this.style.display='none'\" alt='reperto'/>";
  }
  html += "<div class='popup-desc'>" + city.desc + "</div>";
  html += "<div class='popup-era'>" + city.era + "</div>";
  if (city.museum) html += "<div class='popup-museum'>" + city.museum + "</div>";
  return html;
}

function createMarker(city) {
  var civ = civsData[city.civ] || { label:city.civ, color:"#888" };
  var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16'>"
          + "<circle cx='8' cy='8' r='6' fill='" + civ.color + "' fill-opacity='0.88' stroke='rgba(255,255,255,0.45)' stroke-width='1'/>"
          + "</svg>";
  var icon = L.divIcon({ className:"", html:svg, iconSize:[16,16], iconAnchor:[8,8] });
  var marker = L.marker([city.lat, city.lng], { icon:icon });
  marker.bindPopup(makePopup(city, civ), { maxWidth:260 });
  return marker;
}

cities.forEach(function(city) {
  var m = createMarker(city);
  allMarkers.push({ marker:m, civ:city.civ, city:city });
  layerGroup.addLayer(m);
});

function updateVisibility() {
  allMarkers.forEach(function(item) {
    var vis = !hiddenCivs[item.civ];
    if (currentMode === "slider") vis = vis && isActive(item.city, currentYear);
    if (vis) { if (!layerGroup.hasLayer(item.marker)) layerGroup.addLayer(item.marker); }
    else { if (layerGroup.hasLayer(item.marker)) layerGroup.removeLayer(item.marker); }
  });
  Object.keys(civsData).forEach(function(key) {
    var el = document.getElementById("cnt-" + key);
    if (!el) return;
    var n = allMarkers.filter(function(m) {
      return m.civ === key && (currentMode === "all" || isActive(m.city, currentYear));
    }).length;
    el.textContent = "(" + n + ")";
  });
}

function setMode(btn, mode) {
  currentMode = mode;
  document.querySelectorAll(".timeline-btn").forEach(function(b) { b.classList.remove("active"); });
  btn.classList.add("active");
  var slider = document.getElementById("year-slider");
  if (mode === "all") {
    slider.disabled = true;
    document.getElementById("year-label").textContent = "\u2014";
    document.getElementById("period-label").textContent = "";
  } else {
    slider.disabled = false;
    onSlider(slider.value);
  }
  updateVisibility();
}

function onSlider(val) {
  currentYear = parseInt(val);
  document.getElementById("year-label").textContent = formatYear(currentYear);
  document.getElementById("period-label").textContent = getPeriodLabel(currentYear);
  updateVisibility();
}

var legend = L.control({ position:"bottomright" });
legend.onAdd = function() {
  var div = L.DomUtil.create("div", "legend");
  div.innerHTML = "<h4>Civilt&#224;</h4>";
  Object.keys(civsData).forEach(function(key) {
    var civ = civsData[key];
    var count = cities.filter(function(c) { return c.civ === key; }).length;
    var item = document.createElement("div");
    item.className = "legend-item";
    item.innerHTML = "<div class='legend-dot' style='background:" + civ.color + "'></div>"
      + "<span>" + civ.label + " <span id='cnt-" + key + "' style='color:#4a3820'>(" + count + ")</span></span>";
    item.addEventListener("click", function() {
      if (hiddenCivs[key]) { delete hiddenCivs[key]; item.classList.remove("dim"); }
      else { hiddenCivs[key]=true; item.classList.add("dim"); }
      updateVisibility();
    });
    div.appendChild(item);
  });
  var footer = document.createElement("div");
  footer.style.cssText = "margin-top:8px;padding-top:7px;border-top:1px solid #3a2a0a;";
  footer.innerHTML = "<span style='font-size:0.62rem;color:#8a7050;cursor:pointer;text-transform:uppercase;letter-spacing:0.05em;'>Mostra tutte</span>";
  footer.querySelector("span").addEventListener("click", function() {
    hiddenCivs = {};
    document.querySelectorAll(".legend-item").forEach(function(el) { el.classList.remove("dim"); });
    updateVisibility();
  });
  div.appendChild(footer);
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
