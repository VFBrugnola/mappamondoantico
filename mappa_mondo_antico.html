<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Citta Antiche del Mediterraneo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Georgia",serif; background:#1a1208; color:#e8d9b0;
       height:100vh; display:flex; flex-direction:column; overflow:hidden; }
header { background:linear-gradient(to bottom,#0e0a05,#1a1208);
         border-bottom:1px solid #5c3d0a; padding:7px 14px;
         display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
header h1 { font-size:0.95rem; letter-spacing:0.1em; text-transform:uppercase;
            color:#d4a843; font-weight:normal; }
header p { font-size:0.62rem; color:#8a7050; font-style:italic; }
#map { flex:1; width:100%; min-height:0; }
.leaflet-container { background:#0d1a2e; }

/* PERIODO BUTTONS */
#period-bar { flex-shrink:0; background:#0a0805; border-top:1px solid #2a1a00;
  padding:5px 10px; display:flex; gap:5px; overflow-x:auto; align-items:center; }
#period-bar::-webkit-scrollbar { height:3px; }
#period-bar::-webkit-scrollbar-track { background:#1a1208; }
#period-bar::-webkit-scrollbar-thumb { background:#5c3d0a; border-radius:2px; }
.period-btn { flex-shrink:0; background:none; border:1px solid #3a2a0a; color:#8a7050;
  font-family:"Georgia",serif; font-size:0.6rem; padding:3px 8px; cursor:pointer;
  border-radius:2px; letter-spacing:0.05em; white-space:nowrap; transition:all 0.15s; }
.period-btn:hover { border-color:#d4a843; color:#d4a843; }
.period-btn.active { background:rgba(212,168,67,0.18); border-color:#d4a843; color:#d4a843; }
#period-all-btn { flex-shrink:0; background:none; border:1px solid #5c3d0a; color:#d4a843;
  font-family:"Georgia",serif; font-size:0.6rem; padding:3px 9px; cursor:pointer;
  border-radius:2px; letter-spacing:0.06em; text-transform:uppercase; white-space:nowrap; }
#period-all-btn.active { background:rgba(212,168,67,0.18); }

/* TIMELINE BAR */
#timeline-bar { flex-shrink:0; background:#0e0a05; border-top:1px solid #3a2a0a;
  padding:7px 14px 8px; display:flex; align-items:center; gap:10px; }
#year-label { font-family:"Georgia",serif; font-size:0.85rem; color:#d4a843;
  min-width:95px; text-align:center; letter-spacing:0.05em; }
#year-slider { flex:1; -webkit-appearance:none; height:4px;
  background:linear-gradient(to right,#5c3d0a,#d4a843,#5c3d0a);
  border-radius:2px; outline:none; cursor:pointer; }
#year-slider::-webkit-slider-thumb { -webkit-appearance:none; width:15px; height:15px;
  border-radius:50%; background:#d4a843; border:2px solid #0e0a05; cursor:pointer; }
#year-slider::-moz-range-thumb { width:15px; height:15px; border-radius:50%;
  background:#d4a843; border:2px solid #0e0a05; cursor:pointer; }

/* EVENT PANEL */
#event-panel { flex-shrink:0; background:#070503; border-top:1px solid #2a1a00;
  padding:6px 14px; min-height:44px; display:none; align-items:flex-start; gap:10px; }
#event-panel.visible { display:flex; }
#event-dot { width:8px; height:8px; border-radius:50%; background:#d4a843;
  flex-shrink:0; margin-top:4px; box-shadow:0 0 6px rgba(212,168,67,0.6); }
#event-title { font-size:0.72rem; color:#d4a843; margin-bottom:2px; }
#event-desc { font-size:0.65rem; color:#8a7050; line-height:1.4; }
#event-year { font-size:0.62rem; color:#4a3010; margin-top:1px; font-style:italic; }
#event-none { font-size:0.65rem; color:#3a2a0a; font-style:italic; padding:4px 0; }

/* LEGEND */
.legend { background:rgba(14,10,5,0.93); border:1px solid #5c3d0a; border-radius:4px;
  padding:9px 11px; font-family:"Georgia",serif; font-size:0.66rem;
  color:#c8b890; min-width:150px; max-height:calc(100vh - 200px);
  overflow-y:auto; backdrop-filter:blur(4px); }
.legend h4 { font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase;
  color:#d4a843; margin-bottom:7px; border-bottom:1px solid #3a2a0a;
  padding-bottom:4px; font-weight:normal; }
.legend-item { display:flex; align-items:center; gap:6px; margin-bottom:4px;
  cursor:pointer; transition:opacity 0.2s; user-select:none; }
.legend-item:hover { opacity:0.75; }
.legend-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0;
  border:1.5px solid rgba(255,255,255,0.2); }
.legend-item.dim { opacity:0.3; }

/* POPUP */
.leaflet-popup-content-wrapper { background:#0e0a05; border:1px solid #5c3d0a;
  border-radius:4px; color:#e8d9b0; font-family:"Georgia",serif;
  box-shadow:0 4px 20px rgba(0,0,0,0.7); max-width:260px; }
.leaflet-popup-tip { background:#5c3d0a; }
.leaflet-popup-content { margin:10px 13px; }
.popup-title { font-size:0.92rem; color:#d4a843; margin-bottom:1px; }
.popup-modern { font-size:0.63rem; color:#6a5535; font-style:italic; margin-bottom:3px; }
.popup-civ { font-size:0.68rem; font-style:italic; margin-bottom:5px; }
.popup-img { width:100%; height:95px; object-fit:cover; border-radius:2px;
  margin-bottom:5px; border:1px solid #3a2a0a; display:block; }
.popup-desc { font-size:0.7rem; color:#c8b890; line-height:1.5; }
.popup-era { font-size:0.62rem; color:#6a5535; margin-top:3px; }
.popup-museum { font-size:0.62rem; color:#8a7050; margin-top:5px;
  padding-top:4px; border-top:1px solid #2a1a00; line-height:1.4; }
.popup-museum::before { content:"Museo: "; color:#5a4020; }
.leaflet-control-zoom a { background:#0e0a05 !important; color:#d4a843 !important;
  border-color:#5c3d0a !important; }
</style>
</head>

</div>

": "Caduta dell'Impero Romano d'Occidente", "desc": "Odoacre depone Romolo Augustolo, ultimo imperatore romano d'Occidente. Fine del mondo antico."}]</script>
<script id="periods-data" type="application/json">[{"label": "Neolitico", "short": "Neolitico", "min": -9000, "max": -3500, "mid": -6000}, {"label": "Bronzo Antico", "short": "Br. Antico", "min": -3500, "max": -2000, "mid": -2750}, {"label": "Bronzo Medio", "short": "Br. Medio", "min": -2000, "max": -1550, "mid": -1775}, {"label": "Bronzo Tardo", "short": "Br. Tardo", "min": -1550, "max": -1200, "mid": -1375}, {"label": "Prima Età Ferro", "short": "Ferro I", "min": -1200, "max": -800, "mid": -1000}, {"label": "Età Arcaica", "short": "Arcaica", "min": -800, "max": -500, "mid": -650}, {"label": "Età Classica", "short": "Classica", "min": -500, "max": -323, "mid": -415}, {"label": "Età Ellenistica", "short": "Ellenistica", "min": -323, "max": -31, "mid": -175}, {"label": "Età Imperiale", "short": "Imperiale", "min": -31, "max": 476, "mid": 200}]</script>
<script>
var cities   = JSON.parse(document.getElementById("city-data").textContent);
var civsData = JSON.parse(document.getElementById("civs-data").textContent);
var events   = JSON.parse(document.getElementById("events-data").textContent);
var periodsData = JSON.parse(document.getElementById("periods-data").textContent);

// ── MAP ──────────────────────────────────────────────────────────────────────
var map = L.map("map", { center:[35,28], zoom:4, minZoom:3, maxZoom:10 });
var tileProviders = [
  { url:"https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", opts:{ attribution:"&copy; Esri", maxZoom:18 } },
  { url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png", opts:{ attribution:"&copy; OpenStreetMap contributors", maxZoom:19 } },
  { url:"https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png", opts:{ attribution:"&copy; CARTO", subdomains:"abcd", maxZoom:18 } }
];
var tileIdx=0, baseLayer=null;
function tryNextTile() {
  if (tileIdx >= tileProviders.length) return;
  if (baseLayer) map.removeLayer(baseLayer);
  var p = tileProviders[tileIdx];
  baseLayer = L.tileLayer(p.url, p.opts);
  var timer = setTimeout(function() {
    if (document.querySelectorAll(".leaflet-tile-loaded").length === 0) { tileIdx++; tryNextTile(); }
  }, 4000);
  baseLayer.on("tileload", function() { clearTimeout(timer); });
  baseLayer.on("tileerror", function() { clearTimeout(timer); tileIdx++; tryNextTile(); });
  baseLayer.addTo(map);
}
tryNextTile();

// ── STATE ────────────────────────────────────────────────────────────────────
var layerGroup = L.layerGroup().addTo(map);
var allMarkers = [];
var hiddenCivs = {};
var sliderActive = false;
var currentYear = -1200;
var currentPeriod = null; // null = all

// ── PERIOD BUTTONS ───────────────────────────────────────────────────────────
var periodBar = document.getElementById("period-bar");
periodsData.forEach(function(p) {
  var btn = document.createElement("button");
  btn.className = "period-btn";
  btn.textContent = p.short;
  btn.title = p.label + " (" + formatYear(p.min) + " \u2013 " + formatYear(p.max) + ")";
  btn.addEventListener("click", function() { selectPeriod(p, btn); });
  periodBar.appendChild(btn);
});

function selectPeriod(p, btn) {
  currentPeriod = p;
  document.querySelectorAll(".period-btn").forEach(function(b) { b.classList.remove("active"); });
  document.getElementById("period-all-btn").classList.remove("active");
  btn.classList.add("active");
  if (p) {
    // activate slider, set to middle of period
    sliderActive = true;
    var slider = document.getElementById("year-slider");
    slider.min = p.min;
    slider.max = p.max;
    slider.value = p.mid;
    onSlider(p.mid);
    document.getElementById("event-panel").classList.add("visible");
  } else {
    sliderActive = false;
    document.getElementById("year-slider").min = -3500;
    document.getElementById("year-slider").max = 500;
    document.getElementById("year-label").textContent = "\u2014";
    document.getElementById("event-panel").classList.remove("visible");
  }
  updateVisibility();
}

// ── SLIDER ───────────────────────────────────────────────────────────────────
document.getElementById("year-slider").addEventListener("mousedown", function() { sliderActive = true; document.getElementById("event-panel").classList.add("visible"); });
document.getElementById("year-slider").addEventListener("touchstart", function() { sliderActive = true; document.getElementById("event-panel").classList.add("visible"); });

function onSlider(val) {
  currentYear = parseInt(val);
  sliderActive = true;
  document.getElementById("year-label").textContent = formatYear(currentYear);
  // Find nearest event within 75 years
  var nearest = null, bestDist = 999999;
  events.forEach(function(e) {
    var d = Math.abs(e.y - currentYear);
    if (d < bestDist) { bestDist = d; nearest = e; }
  });
  if (nearest && bestDist <= 75) {
    document.getElementById("event-title").textContent = nearest.title;
    document.getElementById("event-year").textContent = formatYear(nearest.y);
    document.getElementById("event-desc").textContent = nearest.desc;
    document.getElementById("event-dot").style.display = "block";
  } else {
    document.getElementById("event-title").textContent = "";
    document.getElementById("event-year").textContent = "";
    document.getElementById("event-desc").textContent = "Nessun evento di rilievo in questo periodo.";
    document.getElementById("event-dot").style.display = "none";
  }
  updateVisibility();
}

function formatYear(y) {
  if (y < 0) return Math.abs(y) + " a.C.";
  if (y === 0) return "1 d.C.";
  return y + " d.C.";
}
function isActive(city, year) { return city.start <= year && city.end >= year; }

// ── MARKERS ──────────────────────────────────────────────────────────────────
function makePopup(city, civ) {
  var imgBase = "https://commons.wikimedia.org/wiki/Special:FilePath/";
  var h = "";
  h += "<div class='popup-title'>" + city.name + "</div>";
  if (city.modern) h += "<div class='popup-modern'>Oggi: " + city.modern + "</div>";
  h += "<div class='popup-civ' style='color:" + civ.color + "'>" + civ.label + "</div>";
  if (city.img) h += "<img class='popup-img' src='" + imgBase + encodeURIComponent(city.img) + "?width=240' onerror=\"this.style.display='none'\" alt='reperto'/>";
  h += "<div class='popup-desc'>" + city.desc + "</div>";
  h += "<div class='popup-era'>" + city.era + "</div>";
  if (city.museum) h += "<div class='popup-museum'>" + city.museum + "</div>";
  return h;
}

function createMarker(city) {
  var civ = civsData[city.civ] || { label:city.civ, color:"#888" };
  var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16'>"
          + "<circle cx='8' cy='8' r='6' fill='" + civ.color + "' fill-opacity='0.88' stroke='rgba(255,255,255,0.45)' stroke-width='1'/>"
          + "</svg>";
  var icon = L.divIcon({ className:"", html:svg, iconSize:[16,16], iconAnchor:[8,8] });
  var marker = L.marker([city.lat, city.lng], { icon:icon });
  marker.bindPopup(makePopup(city, civ), { maxWidth:260 });
  marker.on("popupopen", function() { fetchWikiImage(city.name); });
  return marker;
}

cities.forEach(function(city) {
  var m = createMarker(city);
  allMarkers.push({ marker:m, civ:city.civ, city:city });
  layerGroup.addLayer(m);
});

function updateVisibility() {
  allMarkers.forEach(function(item) {
    var vis = !hiddenCivs[item.civ];
    if (sliderActive) vis = vis && isActive(item.city, currentYear);
    if (vis) { if (!layerGroup.hasLayer(item.marker)) layerGroup.addLayer(item.marker); }
    else { if (layerGroup.hasLayer(item.marker)) layerGroup.removeLayer(item.marker); }
  });
  // update legend counts
  Object.keys(civsData).forEach(function(key) {
    var el = document.getElementById("cnt-" + key);
    if (!el) return;
    var n = allMarkers.filter(function(m) {
      return m.civ === key && (!sliderActive || isActive(m.city, currentYear));
    }).length;
    el.textContent = "(" + n + ")";
  });
}

// ── LEGEND ───────────────────────────────────────────────────────────────────
var legend = L.control({ position:"bottomright" });
legend.onAdd = function() {
  var div = L.DomUtil.create("div", "legend");
  div.innerHTML = "<h4>Civilt&#224;</h4>";
  Object.keys(civsData).forEach(function(key) {
    var civ = civsData[key];
    var count = cities.filter(function(c) { return c.civ === key; }).length;
    var item = document.createElement("div");
    item.className = "legend-item";
    item.innerHTML = "<div class='legend-dot' style='background:" + civ.color + "'></div>"
      + "<span>" + civ.label + " <span id='cnt-" + key + "' style='color:#4a3820'>(" + count + ")</span></span>";
    item.addEventListener("click", function() {
      if (hiddenCivs[key]) { delete hiddenCivs[key]; item.classList.remove("dim"); }
      else { hiddenCivs[key]=true; item.classList.add("dim"); }
      updateVisibility();
    });
    div.appendChild(item);
  });
  var footer = document.createElement("div");
  footer.style.cssText = "margin-top:7px;padding-top:6px;border-top:1px solid #3a2a0a;";
  footer.innerHTML = "<span style='font-size:0.6rem;color:#8a7050;cursor:pointer;text-transform:uppercase;letter-spacing:0.05em;'>Mostra tutte</span>";
  footer.querySelector("span").addEventListener("click", function() {
    hiddenCivs = {};
    document.querySelectorAll(".legend-item").forEach(function(el) { el.classList.remove("dim"); });
    updateVisibility();
  });
  div.appendChild(footer);
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
